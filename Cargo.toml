[package]
name = "nomad"
version = "0.3.1"
edition = "2024"
description = "A thin sqlx-cli style migration tool for ClickHouse"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = {
  version = "0.4",
  default-features = false,
  features = ["clock", "serde"]
}
clap = { version = "4.5", features = ["derive", "string"] }
clickhouse = { version = "0.15", features = ["chrono", "rustls-tls"] }
figment = { version = "0.10", features = ["toml", "yaml"] }
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
inquire = {
  version = "0.9",
  default-features = false,
  features = ["crossterm"]
}
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
