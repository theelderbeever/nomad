[package]
name = "nomad"
version = "0.1.0"
edition = "2024"
description = "A thin sqlx-cli style migration tool for ClickHouse"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
clickhouse = { version = "0.15", features = ["chrono", "rustls-tls"] }
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
